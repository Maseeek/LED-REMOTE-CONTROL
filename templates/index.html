<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Pro Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-dim: #88888b;
            --accent: #1db954;
            --font: 'Outfit', sans-serif;
            --mono: 'JetBrains Mono', monospace;
            --glass: rgba(10, 10, 10, 0.75);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 140px;
        }

        /* Animated Background */
        .bg-blobs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            filter: blur(100px);
            opacity: 0.3;
        }

        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: var(--accent);
            transition: background 2s ease;
            animation: move 25s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -200px;
            left: -200px;
            background: #1db954;
        }

        .blob-2 {
            bottom: -200px;
            right: -200px;
            background: #4c1d95;
            animation-delay: -5s;
        }

        .blob-3 {
            top: 40%;
            left: 50%;
            width: 400px;
            height: 400px;
            background: #0ea5e9;
            animation-delay: -10s;
        }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(150px, 100px) scale(1.1) rotate(45deg); }
            100% { transform: translate(-50px, 150px) scale(0.9) rotate(-45deg); }
        }

        /* Header */
        header {
            width: 100%;
            padding: 6rem 2rem 4rem;
            text-align: center;
            max-width: 1200px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 700;
            letter-spacing: -3px;
            margin-bottom: 0.5rem;
            background: linear-gradient(180deg, #fff 0%, #777 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 500;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-family: var(--mono);
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 0 1.5rem;
        }

        section {
            margin-bottom: 5rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s forwards;
        }

        section:nth-child(1) { animation-delay: 0.2s; }
        section:nth-child(2) { animation-delay: 0.4s; }

        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .section-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .section-header .line {
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--card-border), transparent);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        /* Cards */
        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 2.5rem;
            cursor: pointer;
            transition: var(--transition);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            backdrop-filter: blur(12px);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.1) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
        }

        .card:active {
            transform: translateY(-4px) scale(0.98);
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .card:hover .card-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .card h3 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            z-index: 1;
        }

        .card .type {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            font-family: var(--mono);
        }

        .card-glow {
            position: absolute;
            inset: -20%;
            background: radial-gradient(circle at center, var(--glow-color, var(--accent)) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            filter: blur(40px);
        }

        .card:hover .card-glow {
            opacity: 0.15;
        }

        .card.active {
            border-color: var(--glow-color);
            background: rgba(255, 255, 255, 0.1);
        }

        .card.loading .card-icon {
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Now Playing Bar */
        #now-playing {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(0);
            width: calc(100% - 4rem);
            max-width: 800px;
            padding: 1.25rem 2rem;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 40px;
            display: flex;
            align-items: center;
            z-index: 1000;
            transition: var(--transition);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        #now-playing.hidden {
            transform: translateX(-50%) translateY(150%);
        }

        .now-playing-content {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }

        .status-visual {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wave-container {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 20px;
        }

        .wave-bar {
            width: 3px;
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            animation: wave 1s infinite ease-in-out;
        }

        .wave-bar:nth-child(2) { animation-delay: 0.2s; height: 60%; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; height: 80%; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.5); }
        }

        .paused .wave-bar {
            animation-play-state: paused;
            transform: scaleY(0.3);
            background: var(--text-dim);
        }

        .track-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .track-label {
            font-size: 0.65rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            font-family: var(--mono);
        }

        #track-name {
            font-size: 1.1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: -2px;
        }

        .playback-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: scale(1.1);
        }

        /* Status Toast */
        #status-toast {
            position: fixed;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(-200%);
            padding: 1rem 2rem;
            background: #fff;
            color: #000;
            border-radius: 100px;
            font-weight: 600;
            transition: var(--transition);
            z-index: 2000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #status-toast.visible {
            transform: translateX(-50%) translateY(0);
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            header { padding-top: 4rem; }
            h1 { font-size: 3.5rem; }
            .grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .card { padding: 1.5rem; border-radius: 24px; }
            .card h3 { font-size: 1.2rem; }
            #now-playing { width: calc(100% - 2rem); bottom: 1rem; padding: 1rem 1.5rem; }
        }

        /* Utility */
        svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* LED Controls */
        .led-controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
        }

        .control-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 2.5rem;
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: var(--transition);
        }
        
        .control-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.5);
        }

        .control-card h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .preset-colors {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .preset-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }

        .preset-btn:hover {
            transform: scale(1.2);
            border-color: #fff;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
            transition: var(--transition);
        }
        
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .custom-select, .custom-range {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border);
            color: var(--text);
            padding: 1rem;
            border-radius: 16px;
            font-family: var(--font);
            outline: none;
            font-size: 1rem;
            transition: var(--transition);
        }

        .custom-select:focus, .custom-range:focus {
            border-color: var(--accent);
        }

        .custom-select option {
            background: var(--bg);
            color: var(--text);
        }
        
        .custom-range {
            -webkit-appearance: none;
            height: 8px;
            padding: 0;
            border-radius: 4px;
        }
        
        .custom-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent);
            transition: var(--transition);
        }
        
        .custom-range::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        .control-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: -0.5rem;
            display: block;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            header { padding-top: 4rem; padding-bottom: 2rem; }
            h1 { font-size: 3.5rem; }
            .grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
            .card { padding: 1.5rem; border-radius: 24px; gap: 0.75rem; }
            .card h3 { font-size: 1.1rem; }
            .card-icon { width: 44px; height: 44px; border-radius: 14px; }
            
            .led-controls-grid { grid-template-columns: 1fr; gap: 1rem; }
            .control-card { padding: 1.75rem; border-radius: 28px; }
            .color-picker-container { flex-direction: column; align-items: flex-start; gap: 1rem; }
            input[type="color"] { width: 100%; height: 60px; border-radius: 16px; }
            input[type="color"]::-webkit-color-swatch { border-radius: 12px; }
            
            #now-playing { 
                width: calc(100% - 1.5rem); 
                bottom: 1rem; 
                padding: 0.75rem 1.25rem;
                border-radius: 30px;
            }
            .status-visual { width: 36px; height: 36px; }
            #track-name { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="status-toast">
        <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        <span id="toast-msg">Updated</span>
    </div>

    <header>
        <h1>Lumina</h1>
        <p>Pro Control Interface</p>
    </header>

    <div class="container">
        <section>
            <div class="section-header">
                <h2>Collections</h2>
                <div class="line"></div>
            </div>
            <div id="playlist-grid" class="grid"></div>
        </section>

        <section>
            <div class="section-header">
                <h2>Solo Tracks</h2>
                <div class="line"></div>
            </div>
            <div id="song-grid" class="grid"></div>
        </section>

        <section>
            <div class="section-header">
                <h2>LED Direct Control</h2>
                <div class="line"></div>
            </div>
            <div class="led-controls-grid">
                <div class="control-card">
                    <h3>Static Color</h3>
                    <div class="color-picker-container">
                        <input type="color" id="led-color-picker" value="#1db954">
                        <div style="flex: 1;">
                            <div class="control-label">Custom Selection</div>
                            <div class="preset-colors">
                                <div class="preset-btn" style="background: #ff0000;" data-color="#ff0000"></div>
                                <div class="preset-btn" style="background: #00ff00;" data-color="#00ff00"></div>
                                <div class="preset-btn" style="background: #0000ff;" data-color="#0000ff"></div>
                                <div class="preset-btn" style="background: #ffa500;" data-color="#ffa500"></div>
                                <div class="preset-btn" style="background: #800080;" data-color="#800080"></div>
                                <div class="preset-btn" style="background: #ffffff;" data-color="#ffffff"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="control-card">
                    <h3>Dynamic Modes</h3>
                    <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                        <div>
                            <span class="control-label">Effect Mode</span>
                            <select id="led-mode-select" class="custom-select" style="margin-top: 0.5rem;">
                        <option value="128">Seven Color Cross Fade</option>
                        <option value="129">Red Gradual Change</option>
                        <option value="130">Green Gradual Change</option>
                        <option value="131">Blue Gradual Change</option>
                        <option value="132">Yellow Gradual Change</option>
                        <option value="133">Cyan Gradual Change</option>
                        <option value="134">Purple Gradual Change</option>
                        <option value="135">White Gradual Change</option>
                        <option value="136">Red Green Cross Fade</option>
                        <option value="137">Red Blue Cross Fade</option>
                        <option value="138">Green Blue Cross Fade</option>
                        <option value="139">Seven Color Strobe Flash</option>
                        <option value="147">Seven Color Jumping Change</option>
                            </select>
                        </div>
                        
                        <div>
                            <span class="control-label">Speed (Fast → Slow)</span>
                            <input type="range" id="led-speed-range" class="custom-range" min="1" max="31" value="10" style="margin-top: 1rem;">
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div id="now-playing" class="paused">
        <div class="now-playing-content">
            <div class="status-visual">
                <div class="wave-container">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
            </div>
            <div class="track-info">
                <span class="track-label">System Audio</span>
                <span id="track-name">Spotify Standby</span>
            </div>
            <div class="playback-controls">
                <div class="control-btn" id="play-pause-btn">
                    <svg id="playback-icon" viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"></path></svg>
                </div>
            </div>
        </div>
    </div>

    <script>
        const playlists = {{ playlists | tojson }};
        const songs = {{ songs | tojson }};

        function hexToRgba(hex, alpha = 1) {
            // Check if it's a color command (18 chars: 7e070503RRGGBB10ef)
            if (hex.length === 18 && hex.startsWith('7e070503')) {
                const r = parseInt(hex.slice(8, 10), 16);
                const g = parseInt(hex.slice(10, 12), 16);
                const b = parseInt(hex.slice(12, 14), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }
            // Fallback for modes or unknown formats (Spotify Green)
            return `rgba(29, 185, 84, ${alpha})`;
        }

        function createCard(name, data, type) {
            const card = document.createElement('div');
            card.className = 'card';
            const color = hexToRgba(data.hex);
            const lightColor = hexToRgba(data.hex, 0.1);
            
            card.style.setProperty('--glow-color', color);
            
            card.innerHTML = `
                <div class="card-glow"></div>
                <div class="card-icon" style="color: ${color}; background: ${lightColor};">
                    ${type === 'Playlist' ? 
                        '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>' : 
                        '<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>'
                    }
                </div>
                <div style="z-index: 1; position: relative;">
                    <span class="type">${type}</span>
                    <h3 style="color: #fff">${name}</h3>
                </div>
            `;

            card.style.borderColor = hexToRgba(data.hex, 0.1);
            
            // Mouse move effect for radial light
            card.onmousemove = (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--x', `${x}px`);
                card.style.setProperty('--y', `${y}px`);
            };

            card.onclick = async () => {
                document.querySelectorAll('.card').forEach(c => c.classList.remove('active', 'loading'));
                card.classList.add('loading');
                showToast(`Activating ${name}...`);
                
                try {
                    const response = await fetch(`/${name}`);
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        card.classList.remove('loading');
                        card.classList.add('active');
                        // Update background blobs
                        document.querySelectorAll('.blob').forEach(b => b.style.background = color);
                    }
                } catch (err) {
                    card.classList.remove('loading');
                    showToast('Connection Refused');
                }
            };

            return card;
        }

        function showToast(msg) {
            const toast = document.getElementById('status-toast');
            const msgSpan = document.getElementById('toast-msg');
            msgSpan.innerText = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        // Grids
        const pGrid = document.getElementById('playlist-grid');
        Object.entries(playlists).forEach(([name, data]) => pGrid.appendChild(createCard(name, data, 'Playlist')));

        const sGrid = document.getElementById('song-grid');
        Object.entries(songs).forEach(([name, data]) => sGrid.appendChild(createCard(name, data, 'Track')));

        // Debounce helper
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // LED Controls
        const handleColorChange = debounce(async (colorHex) => {
            const r = parseInt(colorHex.slice(1, 3), 16);
            const g = parseInt(colorHex.slice(3, 5), 16);
            const b = parseInt(colorHex.slice(5, 7), 16);
            
            try {
                await fetch('/api/led/color', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({r, g, b})
                });
                document.querySelectorAll('.blob').forEach(blob => blob.style.background = colorHex);
                const picker = document.getElementById('led-color-picker');
                picker.style.boxShadow = `0 0 30px ${colorHex}40`;
            } catch (err) {
                showToast('Failed to set color');
            }
        }, 50); // Small debounce for efficient time transfer during dragging

        const handleModeChange = debounce(async () => {
            const mode = document.getElementById('led-mode-select').value;
            const speed = document.getElementById('led-speed-range').value;
            
            try {
                await fetch('/api/led/mode', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({mode: parseInt(mode), speed: parseInt(speed)})
                });
            } catch (err) {
                showToast('Failed to set mode');
            }
        }, 100);

        document.getElementById('led-color-picker').addEventListener('input', (e) => handleColorChange(e.target.value));
        document.getElementById('led-mode-select').addEventListener('change', handleModeChange);
        document.getElementById('led-speed-range').addEventListener('input', handleModeChange);

        // Preset buttons
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.onclick = () => {
                const color = btn.getAttribute('data-color');
                const picker = document.getElementById('led-color-picker');
                picker.value = color;
                handleColorChange(color);
            };
        });

        // Status Polling
        let lastTitle = "";
        let lastColor = "";
        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                
                const np = document.getElementById('now-playing');
                const track = document.getElementById('track-name');
                const icon = document.getElementById('playback-icon');
                
                if (data.title !== lastTitle) {
                    track.innerText = data.title;
                    lastTitle = data.title;
                }
                
                if (data.color && data.color !== lastColor) {
                    const activeColor = hexToRgba(data.color);
                    const bars = document.querySelectorAll('.wave-bar');
                    bars.forEach(bar => bar.style.background = activeColor);
                    
                    // Sync background blobs with the current LED color
                    document.querySelectorAll('.blob').forEach(b => b.style.background = activeColor);
                    lastColor = data.color;
                }

                if (data.playing) {
                    np.classList.remove('paused');
                    icon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
                } else {
                    np.classList.add('paused');
                    icon.innerHTML = '<path d="M5 3l14 9-14 9V3z"></path>';
                }
            } catch (err) {
                // Silently fail or show small indicator
            }
        }

        setInterval(updateStatus, 1000);
        updateStatus();
    </script>
</body>
</html>
